# Messages for Logger Plugin [ Proxy Version ]
# Need Support? Join the Discord Server: https://discord.gg/MfR5mcpVfX
# Config 1.8.4
# Plugin Messages
General:
  No-Permission: "&cYou do not have permission to run this command."
  Reload: "&aConfigs Reloaded."
  Invalid-Syntax: "&cInvalid Syntax."
# Files Instance
Files:
  Player-Chat-Staff: "[%time%] [%server%] The Staff <%player%> has said => %msg%"
  Player-Chat: "[%time%] [%server%] The Player <%player%> has said => %msg%"
  Player-Command-Staff: "[%time%] [%server%] The Staff <%player%> has executed => %command%"
  Player-Command: "[%time%] [%server%] The Player <%player%> has executed => %command%"
  Player-Login-Staff: "[%time%] [%server%] The Staff <%player%> has joined with IP -> %IP%"
  Player-Login: "[%time%] [%server%] The Player <%player%> has joined with IP -> %IP%"
  Player-Leave-Staff: "[%time%] [%server%] The Staff <%player%> has left the server"
  Player-Leave: "[%time%] [%server%] The Player <%player%> has left the server"
  Player-Switch-Staff: "[%time%] [%server%] The Staff <%player%> has switched from %from% to %to%"
  Player-Switch: "[%time%] [%server%] The Player <%player%> has switched from %from% to %to%"
  Player-Kick-Staff: "[%time%] [%server%] The Staff <%player%> has been kicked from %server% for %reason%"
  Player-Kick: "[%time%] [%server%] The Player <%player%> has been kicked from %server% for %reason%"
# Server Side Part
  Server-Side:
    Reload-Console: "[%time%] [%server%] The server has been reloaded"
    Server-Commands: "[%time%] [%server%] %command%"
    Console-Commands: "[%time%] [%server%] %command%"
    Start: "[%time%] [%server%] The server has started"
    Stop: "[%time%] [%server%] The server has stopped"
    RAM: "[%time%] [%server%] The Server has exceeded the set amount of percentage of RAM Usage! Total: %max% | Used: %used% | Free: %free%"
    Manual-Log: "[%time%] [%server%] Manual log recorded => %log%"
# Discord Instance
# Emojis can be found here https://emojipedia.org/ or elsewhere. Emojis may not work on >1.12 Servers.
Discord:
  Player-Chat-Staff: "**[%time%]** **[%server%]** **%msg%**"
  Player-Chat: "**[%time%]** **[%server%]** **%msg%**"
  Player-Command-Staff: "**[%time%]** **[%server%]** **%command%**"
  Player-Command: "**[%time%]** **[%server%]** **%command%**"
  Player-Login-Staff: "**[%time%]** ||**%IP%**||"
  Player-Login: "**[%time%]** ||**%IP%**||"
  Player-Leave-Staff: "**[%time%]** **[%server%]** Left the server"
  Player-Leave: "**[%time%]** **[%server%]** Left the server"
  Player-Switch-Staff: "**[%time%]** Switched from **%from%** to **%to%**"
  Player-Switch: "**[%time%]** Switched from **%from%** to **%to%**"
  Player-Kick-Staff: "**[%time%]** **[%server%]** Kicked from **%server%** for **%reason%**"
  Player-Kick: "**[%time%]** **[%server%]** Kicked from **%server%** for **%reason%**"
# Server Side Part
  Server-Side:
    Reload-Console: "**[%time%]** The server has been reloaded"
    Restart-Console: "**[%time%]** The server has been reloaded"
    Server-Commands: "**[%time%]** %command%"
    Console-Commands: "**[%time%]** %command%"
    Start: "**[%time%]**"
    Stop: "**[%time%]**"
    RAM: "**[%time%]** The Server has exceeded the set amount of percentage of RAM Usage! Total Memory: **%max%** `|` Used Memory: **%used%** `|` Free Memory: **%free%**"
    Manual-Log: "**[%time%]** Manual log: **%log%**"
