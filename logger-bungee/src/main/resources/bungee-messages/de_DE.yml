# Messages for Logger Plugin [ Proxy Version ]
# Need Support? Join the Discord Server: https://discord.gg/MfR5mcpVfX
# Config 1.8.3
# Plugin Messages
General:
  No-Permission: "&cDu hast keine Berechtigung, diesen Befehl auszuführen."
  Reload: "&aKonfigurationen neu geladen."
  Invalid-Syntax: "&cUngültige Syntax."
# Files Instance
Files:
  Player-Chat-Staff: "[%time%] [%server%] Team <%player%>: %msg%"
  Player-Chat: "[%time%] [%server%] Spieler <%player%>: %msg%"
  Player-Command-Staff: "[%time%] [%server%] Team <%player%> hat ausgeführt: %command%"
  Player-Command: "[%time%] [%server%] Spieler <%player%> hat ausgeführt: %command%"
  Player-Login-Staff: "[%time%] [%server%] Team <%player%> ist beigetreten mit IP -> %IP%"
  Player-Login: "[%time%] [%server%] Spieler <%player%> ist beigetreten mit IP -> %IP%"
  Player-Leave-Staff: "[%time%] [%server%] Team <%player%> hat den Server verlassen"
  Player-Leave: "[%time%] [%server%] Spieler <%player%> hat den Server verlassen"
  Player-Switch-Staff: "[%time%] [%server%] Team <%player%> hat gewechselt von %from% zu %to%"
  Player-Switch: "[%time%] [%server%] Spieler <%player%> hat gewechselt von %from% zu %to%"
  Player-Kick-Staff: "[%time%] [%server%] Team <%player%> wurde gekickt von %server% Grund: %reason%"
  Player-Kick: "[%time%] [%server%] Spieler <%player%> wurde gekickt von %server% Grund: %reason%"
# Server Side Part
  Server-Side:
    Reload-Console: "[%time%] [%server%] Der Server wurde neu geladen"
    Server-Commands: "[%time%] [%server%] %command%"
    Console-Commands: "[%time%] [%server%] %command%"
    Start: "[%time%] [%server%] Der Server wurde gestartet"
    Stop: "[%time%] [%server%] Der Server wurde gestoppt"
    RAM: "[%time%] [%server%] RAM-Warnung! Gesamt: %max% | Verwendet: %used% | Frei: %free%"
    Manual-Log: "[%time%] [%server%] Manuelles Protokoll aufgezeichnet => %log%"
# Discord Instance
# Emojis can be found here https://emojipedia.org/ or elsewhere. Emojis may not work on >1.12 Servers.
