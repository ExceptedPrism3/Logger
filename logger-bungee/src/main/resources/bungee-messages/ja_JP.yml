# Config 1.8.3
# Plugin Messages
General:
  No-Permission: "&cこのコマンドを実行する権限がありません。"
  Reload: "&a設定が再読み込みされました。"
  Invalid-Syntax: "&c構文が無効です。"
# Files Instance
Files:
  Player-Chat-Staff: "[%time%] [%server%] スタッフ <%player%>: %msg%"
  Player-Chat: "[%time%] [%server%] プレイヤー <%player%>: %msg%"
  Player-Command-Staff: "[%time%] [%server%] スタッフ <%player%> が実行: %command%"
  Player-Command: "[%time%] [%server%] プレイヤー <%player%> が実行: %command%"
  Player-Login-Staff: "[%time%] [%server%] スタッフ <%player%> が参加しました。IP -> %IP%"
  Player-Login: "[%time%] [%server%] プレイヤー <%player%> が参加しました。IP -> %IP%"
  Player-Leave-Staff: "[%time%] [%server%] スタッフ <%player%> が退出しました"
  Player-Leave: "[%time%] [%server%] プレイヤー <%player%> が退出しました"
  Player-Switch-Staff: "[%time%] [%server%] スタッフ <%player%> が %from% から %to% に切り替えました"
  Player-Switch: "[%time%] [%server%] プレイヤー <%player%> が %from% から %to% に切り替えました"
  Player-Kick-Staff: "[%time%] [%server%] スタッフ <%player%> がキックされました。理由: %reason%"
  Player-Kick: "[%time%] [%server%] プレイヤー <%player%> がキックされました。理由: %reason%"
# Server Side Part
  Server-Side:
    Reload-Console: "[%time%] [%server%] サーバーが再読み込みされました"
    Server-Commands: "[%time%] [%server%] %command%"
    Console-Commands: "[%time%] [%server%] %command%"
    Start: "[%time%] [%server%] サーバーが起動しました"
    Stop: "[%time%] [%server%] サーバーが停止しました"
    RAM: "[%time%] [%server%] RAM 警告！合計: %max% | 使用中: %used% | 空き: %free%"
    Manual-Log: "[%time%] [%server%] 手動ログが記録されました => %log%"
