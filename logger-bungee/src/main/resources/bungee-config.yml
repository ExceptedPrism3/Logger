# Config 1.8.3

# Language (Available: en_US, fr_FR, es_ES, de_DE, it_IT, pt_BR, ru_RU, zh_CN, ja_JP, ko_KR, ar_SA)
Language: "en_US"

# Server Name
Server-Name: "Server_Name"

# Date & Time Formatter
Time-Formatter: "yyyy-MM-dd HH:mm:ss"

# How many Days for the logs to be deleted
# Set it to -1 to cancel the Deletion
File-Deletion: 7

# Log to Files
Log-to-Files: true

# This will log players with the "loggerproxy.staff.log" permission node in their own folder / file
Staff:
  Enabled: false

# Logging features
Log-Player:
  Chat: true
  Commands: true
  Login: true
  Leave: true
  Switch: true
  Kick: true

Log-Server:
  Console-Commands: true
  Reload: true
  Start: true
  Stop: true
  RAM: true
  Manual-Log: true

# Enable to show Player's IPs
Player-Login:
  Player-IP: false

# Server RAM
# How often should we check for the Proxy's RAM
# It's better to have it above 1 min to avoid any complications
# Value in Ticks, 20 Ticks = 1 Second
# Percent goes from 0 -> 100
RAM:
  Checker: 6000
  Percent: 50

# External Database Feature
# Available Types are MySQL and MariaDB
# Data-Deletion Value in Days, Set it -1 to cancel
Database:
  Enable: false
  Type: MySQL
  Host: localhost
  Port: 3306
  Username: username
  Password: PassworD
  Database: database
  Data-Deletion: 7

# SQLite Feature
# Data-Deletion Value in Days, Set it -1 to cancel
SQLite:
  Enable: false
  Data-Deletion: 7

# Checks for Updates
Update-Checker: true
