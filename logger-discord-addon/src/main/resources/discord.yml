# Settings for the logs
# "normal" for regular messages, "embed" for embed messages
Message-Type: "normal"

Embed-Settings:
  Title: "Server Notification"  # Fallback title (used if event type is unknown)
  Color: "#FF5733"  # The hex color for the embed (optional)
  Footer: "Sent by Logger Bot"
  Timestamp: true  # Whether to include the current timestamp in the embed

# Bot Activity Status
# Randomize the shown status
# Change the Status of the Bot [ online , idle , dnd , invisible ]
ActivityCycling:
  Enabled: true
  Random: false
  Status: idle
  Activities:
    - ["watching", "Minecraft Movie"]
    - ["playing", "Minecraft 1.7"]
    - ["listening", "Dragon's Heart Beats"]
    - ["streaming", "Minecraft Gameplay"]
  Time: 30

# Do not touch unless you want to reset it's content
Discord-Version: 1.8.4
