        tr: tr_TR
        sv-SE: sv_SE
        lt: lt_LT
        ro: ro_RO
        fa: fa_IR

  # ----------------------------------------------------------------------------
  # Velocity Proxy Messages
  # ----------------------------------------------------------------------------
